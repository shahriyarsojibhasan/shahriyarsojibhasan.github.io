  <!-- Background Particle Network Canvas -->
  <canvas id="meshCanvas" aria-hidden="true"></canvas>


  <!-- Ambient background mesh logic -->
  <script>
    (function () {
      var canvas = document.getElementById('meshCanvas');
      if (!canvas) return;
      var ctx = canvas.getContext('2d');
      if (!ctx) return;
      var prefersReduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (prefersReduced) {
        canvas.style.display = 'none';
        return;
      }

      var nodes = [];
      var pointer = { x: -999, y: -999 };
      var isRunning = !document.hidden;
      var lastFrame = 0;

      function resize() {
        var isMobile = window.innerWidth < 768;
        if (isMobile) {
          canvas.style.display = 'none';
          nodes = [];
          return;
        }
        canvas.style.display = 'block';
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        var count = Math.min(32, Math.floor((canvas.width * canvas.height) / 36000));
        nodes = [];
        for (var i = 0; i < count; i++) {
          nodes.push({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            vx: (Math.random() - 0.5) * 0.3,
            vy: (Math.random() - 0.5) * 0.3,
            r: Math.random() * 1.2 + 0.6
          });
        }
      }

      document.addEventListener('visibilitychange', function () {
        isRunning = !document.hidden;
      });

      window.addEventListener('mousemove', function (e) {
        pointer.x = e.clientX;
        pointer.y = e.clientY;
      }, { passive: true });

      window.addEventListener('resize', resize, { passive: true });
      resize();

      function tick(now) {
        requestAnimationFrame(tick);
        if (!isRunning || nodes.length === 0) return;
        // Throttle 2D particle canvas to ~30fps to guarantee butter-smooth 60fps for WebGL & scrolling
        if (now - lastFrame < 32) return;
        lastFrame = now;

        ctx.clearRect(0, 0, canvas.width, canvas.height);
        var dotColor = 'rgba(229, 9, 20, 0.45)';
        var lineBase = '163, 9, 14';

        for (var i = 0; i < nodes.length; i++) {
          var p = nodes[i];
          p.x += p.vx;
          p.y += p.vy;
          if (p.x < 0 || p.x > canvas.width) p.vx *= -1;
          if (p.y < 0 || p.y > canvas.height) p.vy *= -1;

          ctx.fillStyle = dotColor;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
          ctx.fill();

          for (var j = i + 1; j < nodes.length; j++) {
            var q = nodes[j];
            var dx = p.x - q.x;
            var dy = p.y - q.y;
            if (Math.abs(dx) > 115 || Math.abs(dy) > 115) continue;
            var distSq = dx * dx + dy * dy;
            if (distSq < 13225) { // 115 * 115
              var dist = Math.sqrt(distSq);
              ctx.strokeStyle = 'rgba(' + lineBase + ', ' + (0.16 * (1 - dist / 115)).toFixed(3) + ')';
              ctx.lineWidth = 1;
              ctx.beginPath();
              ctx.moveTo(p.x, p.y);
              ctx.lineTo(q.x, q.y);
              ctx.stroke();
            }
          }

          var mdx = p.x - pointer.x;
          var mdy = p.y - pointer.y;
          if (Math.abs(mdx) < 130 && Math.abs(mdy) < 130) {
            var mdistSq = mdx * mdx + mdy * mdy;
            if (mdistSq < 16900) { // 130 * 130
              var mdist = Math.sqrt(mdistSq);
              ctx.strokeStyle = 'rgba(229, 9, 20, ' + (0.28 * (1 - mdist / 130)).toFixed(3) + ')';
              ctx.lineWidth = 1;
              ctx.beginPath();
              ctx.moveTo(p.x, p.y);
              ctx.lineTo(pointer.x, pointer.y);
              ctx.stroke();
            }
          }
        }
      }
      requestAnimationFrame(tick);
    })();
  </script>
