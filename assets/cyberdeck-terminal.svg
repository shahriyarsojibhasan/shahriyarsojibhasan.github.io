  <rect x="436" y="272" width="460" height="14" rx="7" fill="#140d12" stroke="rgba(229, 9, 20, 0.4)" stroke-width="1"/>
  <rect x="438" y="274" width="456" height="10" rx="5" fill="url(#progGrad)"/>
  <text x="912" y="283" class="mono" font-size="12.5" font-weight="700" fill="#ff334b">100% OPERATIONAL</text>

