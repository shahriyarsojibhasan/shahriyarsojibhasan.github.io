<svg width="1200" height="330" viewBox="0 0 1200 330" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="termBg" x1="0" y1="0" x2="1200" y2="330" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#070608"/>
      <stop offset="55%" stop-color="#0c080b"/>
      <stop offset="100%" stop-color="#120d10"/>
    </linearGradient>
    <linearGradient id="neonBorder" x1="0" y1="0" x2="1200" y2="330" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#680509"/>
      <stop offset="50%" stop-color="#e50914"/>
      <stop offset="100%" stop-color="#ff2a38"/>
    </linearGradient>
    <linearGradient id="progGrad" x1="450" y1="0" x2="880" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#680509"/>
      <stop offset="50%" stop-color="#e50914"/>
      <stop offset="100%" stop-color="#ff2a38"/>
    </linearGradient>
    <radialGradient id="emblemGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(215 152) rotate(90) scale(130 130)">
      <stop offset="0%" stop-color="#e50914" stop-opacity="0.30"/>
      <stop offset="55%" stop-color="#ff2a38" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#070608" stop-opacity="0"/>
    </radialGradient>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: 'JetBrains Mono', 'Cascadia Code', monospace; }
      @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
      @keyframes eq1 { 0%, 100% { height: 10px; y: 274px; } 50% { height: 26px; y: 258px; } }
      @keyframes eq2 { 0%, 100% { height: 24px; y: 260px; } 50% { height: 8px; y: 276px; } }
      @keyframes eq3 { 0%, 100% { height: 14px; y: 270px; } 50% { height: 28px; y: 256px; } }
      @keyframes spinSlow {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      .cursor { animation: blink 1s step-end infinite; }
      .b1 { animation: eq1 0.9s ease-in-out infinite; }
      .b2 { animation: eq2 0.75s ease-in-out infinite; }
      .b3 { animation: eq3 1.05s ease-in-out infinite; }
      .b4 { animation: eq2 0.85s ease-in-out infinite 0.2s; }
      .b5 { animation: eq1 0.95s ease-in-out infinite 0.15s; }
      .orbit { transform-box: fill-box; transform-origin: center; animation: spinSlow 24s linear infinite; }
    </style>
  </defs>

  <rect x="3" y="3" width="1194" height="324" rx="18" fill="url(#termBg)" stroke="url(#neonBorder)" stroke-width="2"/>

  <!-- Top Terminal Chrome -->
