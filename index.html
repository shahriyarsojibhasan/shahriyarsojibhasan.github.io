<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shahriyar Sojib Hasan | Cyberpunk Portfolio</title>
    <meta name="description" content="Futuristic full-stack developer, hacker, and cyberpunk UI architect.">
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel for in-browser JSX compiling -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        darkBg: '#0d1117',
                        neonPink: '#F75C7E',
                        neonPurple: '#7F5AF0',
                    },
                    fontFamily: {
                        orbitron: ['Orbitron', 'sans-serif'],
                        space: ['Space Grotesk', 'sans-serif'],
                    },
                    boxShadow: {
                        'neon-pink': '0 0 10px #F75C7E, inset 0 0 10px #F75C7E',
                        'neon-purple': '0 0 10px #7F5AF0, inset 0 0 10px #7F5AF0',
                        'neon-pink-hover': '0 0 20px #F75C7E, inset 0 0 15px #F75C7E',
                        'glass': '0 8px 32px 0 rgba(127, 90, 240, 0.2)',
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #0d1117;
            color: #ffffff;
            margin: 0;
            overflow-x: hidden;
        }

        /* Cyberpunk Scanline Effect */
        .scanlines {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0) 50%, rgba(0,0,0,0.1) 50%, rgba(0,0,0,0.1));
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 9999;
            opacity: 0.3;
        }

        /* Glassmorphism */
        .glass-card {
            background: rgba(13, 17, 23, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(127, 90, 240, 0.3);
            transition: all 0.3s ease;
        }

        .glass-card:hover {
            border: 1px solid rgba(247, 92, 126, 0.6);
            box-shadow: 0 0 20px rgba(247, 92, 126, 0.2);
            transform: translateY(-5px);
        }

        /* Text Glow */
        .text-glow-pink { text-shadow: 0 0 10px #F75C7E; }
        .text-glow-purple { text-shadow: 0 0 10px #7F5AF0; }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0d1117; }
        ::-webkit-scrollbar-thumb { background: #7F5AF0; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #F75C7E; }
    </style>
</head>
<body>
    <div class="scanlines"></div>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const Navbar = () => (

                <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                    <div className="flex items-center justify-between h-20">
                        <div className="flex-shrink-0">
                            <span className="font-orbitron font-bold text-2xl tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-neonPink to-neonPurple text-glow-pink">
                                SHAHRIYAR.SYS
                            </span>
                        </div>
                        <div className="hidden md:block">
                            <div className="ml-10 flex items-baseline space-x-8 font-space">
                                <a href="#home" className="hover:text-neonPink transition-colors duration-300">Home</a>
                                <a href="#about" className="hover:text-neonPink transition-colors duration-300">Identity</a>
                                <a href="#stack" className="hover:text-neonPink transition-colors duration-300">Arsenal</a>
                                <a href="#workspace" className="hover:text-neonPink transition-colors duration-300">Workspace</a>
                            </div>
                        </div>
                    </div>
                </div>
            </nav>
        );

        const Hero = () => (

                <div className="absolute top-1/3 left-1/3 w-72 h-72 bg-neonPink/10 rounded-full blur-[100px] pointer-events-none"></div>

                    <span className="text-transparent bg-clip-text bg-gradient-to-r from-neonPink to-neonPurple text-glow-pink">Beyond Reality</span>

                            <p className="mb-1 text-gray-300">[+] Establishing secure connection to mainframe...</p>

                            <p className="mb-1 text-neonPurple">> NAME: <span className="text-white">Shahriyar Sojib Hasan</span></p>

                    <img

                        className="mx-auto hover:scale-105 transition-transform duration-500 drop-shadow-[0_0_15px_rgba(127,90,240,0.5)]"
                    />
                </div>
            </section>
        );

        const Workspace = () => {
            const tools = ["Windows 10", "Kali Linux", "Android Studio", "VS Code", "Windows Terminal", "Bash", "ZSH"];
            return (
                <section id="workspace" className="py-20 px-4 max-w-4xl mx-auto relative z-10">

                        <span className="text-neonPurple">03.</span> SYSTEM_PREF

                    <p className="mt-6 font-orbitron text-neonPurple font-bold tracking-widest uppercase">

        const Footer = () => {

                { icon: 'fa-github', link: 'https://github.com/shahriyarsojibhasan', name: 'GitHub' },
                { icon: 'fa-twitter', link: 'https://twitter.com/shahriyarsojib_', name: 'X/Twitter' },

                { icon: 'fa-facebook-f', link: 'https://facebook.com/shahriyarsojibhasan', name: 'Facebook' },
                { icon: 'fa-linkedin-in', link: 'https://linkedin.com/in/shahriyarsojibhasan', name: 'LinkedIn' },

            return (

                        <h2 className="font-orbitron text-2xl mb-8 text-glow-pink">ESTABLISH_COMM_LINK</h2>
                        <div className="flex flex-wrap justify-center gap-6 mb-12">

        const App = () => {
            return (
                <div className="min-h-screen selection:bg-neonPink selection:text-darkBg">

                    <Hero />
                    <Terminal />
                    <About />
                    <TechStack />
                    <Workspace />
                    <Philosophy />

                </div>

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
